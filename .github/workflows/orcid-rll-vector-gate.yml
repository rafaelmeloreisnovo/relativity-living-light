name: ORCID RLL Vector Gate

on:
  pull_request:
    paths:
      - "src/rll/orcid_vector*.py"
      - "src/rll/project_sources.py"
      - "src/rll/project_source_seed.py"
      - "tools/validate_fundamental_real_data_topology.py"
      - "tests/test_orcid_vector.py"
      - "tests/test_project_sources.py"
      - "tests/test_project_source_seed.py"
      - "tests/test_fundamental_real_data_topology.py"
      - "schemas/orcid_vector_artifact.schema.json"
      - "schemas/project_source_manifest.schema.json"
      - "schemas/project_source_seed.schema.json"
      - "schemas/rll_route_forest_blueprint.schema.json"
      - "schemas/fingerprints/**"
      - "configs/orcid_rll_sources.yml"
      - "configs/project_sources_manifest.v1.json"
      - "configs/project_sources_seed.v1.json"
      - "data/examples/*synthetic.json"
      - "data/project_sources/seed_v1/**"
      - "data/ledgers/orcid_rll_integration_state.json"
      - "data/ledgers/project_sources_integration_state.json"
      - "data/ledgers/REAL_SEED_RECEIPT_20260731.json"
      - "data/manifests/dados_reais_fundamentais_v1.json"
      - "data/knowledge_forest/rll_route_forest_blueprint.json"
      - "data/pipelines/structure_d/datasets_config.json"
      - "data/failsafe/**"
      - "data/real/**"
      - "docs/canonicos/METODOLOGIA_COERENTE_RLL.md"
      - "rll_equation_registry.yml"
      - "RLL_JSON_EVOLUTION_WATCHER.yml"
      - "pyproject.toml"
      - ".github/workflows/orcid-rll-vector-gate.yml"
  push:
    branches: [main]
    paths:
      - "src/rll/orcid_vector*.py"
      - "src/rll/project_sources.py"
      - "src/rll/project_source_seed.py"
      - "tools/validate_fundamental_real_data_topology.py"
      - "tests/test_orcid_vector.py"
      - "tests/test_project_sources.py"
      - "tests/test_project_source_seed.py"
      - "tests/test_fundamental_real_data_topology.py"
      - "schemas/orcid_vector_artifact.schema.json"
      - "schemas/project_source_manifest.schema.json"
      - "schemas/project_source_seed.schema.json"
      - "schemas/rll_route_forest_blueprint.schema.json"
      - "schemas/fingerprints/**"
      - "configs/orcid_rll_sources.yml"
      - "configs/project_sources_manifest.v1.json"
      - "configs/project_sources_seed.v1.json"
      - "data/examples/*synthetic.json"
      - "data/project_sources/seed_v1/**"
      - "data/ledgers/orcid_rll_integration_state.json"
      - "data/ledgers/project_sources_integration_state.json"
      - "data/ledgers/REAL_SEED_RECEIPT_20260731.json"
      - "data/manifests/dados_reais_fundamentais_v1.json"
      - "data/knowledge_forest/rll_route_forest_blueprint.json"
      - "data/pipelines/structure_d/datasets_config.json"
      - "data/failsafe/**"
      - "data/real/**"
      - "docs/canonicos/METODOLOGIA_COERENTE_RLL.md"
      - "rll_equation_registry.yml"
      - "RLL_JSON_EVOLUTION_WATCHER.yml"
      - "pyproject.toml"
      - ".github/workflows/orcid-rll-vector-gate.yml"

permissions:
  contents: read

jobs:
  offline-deterministic-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest jsonschema pyyaml
      - name: Compile implementation and validators
        run: |
          python -m py_compile \
            src/rll/orcid_vector*.py \
            src/rll/project_sources.py \
            src/rll/project_source_seed.py \
            tools/validate_fundamental_real_data_topology.py
      - name: Run vector, corpus, seed and topology tests
        env:
          PYTHONPATH: src
        run: |
          pytest -q \
            tests/test_orcid_vector.py \
            tests/test_project_sources.py \
            tests/test_project_source_seed.py \
            tests/test_fundamental_real_data_topology.py
      - name: Validate JSON Schema syntax
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          for path in (
              "schemas/orcid_vector_artifact.schema.json",
              "schemas/project_source_manifest.schema.json",
              "schemas/project_source_seed.schema.json",
              "schemas/rll_route_forest_blueprint.schema.json",
          ):
              Draft202012Validator.check_schema(json.load(open(path)))
          PY
      - name: Validate committed project manifest boundary
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from pathlib import Path
          from rll.project_sources import load_manifest
          manifest = load_manifest(Path("configs/project_sources_manifest.v1.json"))
          assert manifest["source_count"] == 14
          assert manifest["raw_bodies_committed"] is False
          assert all(item["claim_allowed"] is False for item in manifest["sources"])
          assert sum(item["visibility"] == "PRIVATE_POINTER_ONLY" for item in manifest["sources"]) == 1
          PY
      - name: Verify and bootstrap committed real seed
        env:
          PYTHONPATH: src
        run: |
          SEED_DB="${RUNNER_TEMP}/project-sources-seed.sqlite3"
          python -m rll.project_source_seed verify
          python -m rll.project_source_seed bootstrap --db "$SEED_DB"
          python -m rll.project_source_seed status --db "$SEED_DB"
          python -m rll.project_source_seed search "ORCID vetores proveniência" --db "$SEED_DB"
      - name: Validate fundamental real-data topology
        run: |
          python tools/validate_fundamental_real_data_topology.py \
            --write-receipt artifacts/fundamental-real-data-topology/receipt.json
      - name: Run offline CLI receipt
        env:
          PYTHONPATH: src
        run: |
          DB="${RUNNER_TEMP}/orcid-rll.sqlite3"
          python -m rll.orcid_vector --db "$DB" init
          python -m rll.orcid_vector --db "$DB" ingest-file data/examples/orcid_record_synthetic.json --orcid 0000-0000-0000-001X
          python -m rll.orcid_vector --db "$DB" verify-chain
          python -m rll.orcid_vector --db "$DB" search "quantum tensor physiology" --discipline physics.quantum
          python -m rll.project_sources --db "$DB" status
      - name: Upload topology receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fundamental-real-data-topology-${{ matrix.python-version }}-${{ github.run_id }}
          path: artifacts/fundamental-real-data-topology/receipt.json
          retention-days: 14
