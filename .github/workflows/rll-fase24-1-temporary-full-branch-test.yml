name: "TEMP — RLL FASE 24.1 completo na branch"

on:
  push:
    branches:
      - fix/fase24-1-orchestrator-artifacts-20260731
    paths:
      - ".github/workflows/rll-fase24-1-temporary-full-branch-test.yml"

permissions:
  contents: write

jobs:
  record-run-id:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registrar run para auditoria
        run: |
          set -euo pipefail
          mkdir -p docs/audits
          cat > docs/audits/TEMP_FASE24_1_FULL_RUN.json <<JSON
          {
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "commit_sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "mode": "completo",
            "claim_allowed": false
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/TEMP_FASE24_1_FULL_RUN.json
          git commit -m "test(fase24.1): registrar run completo ${{ github.run_id }}"
          git push origin HEAD:${{ github.ref_name }}

  full-branch-audit:
    needs: record-run-id
    uses: ./.github/workflows/rll-pipeline-linear-completo.yml
    with:
      modo: completo
