name: Validate Academic Correlation Package and Build Research Preview

on:
  pull_request:
    paths:
      - 'docs/research/ACADEMIC_CORRELATION_CANDIDATE_MAP.md'
      - 'docs/codex/CODEX_ACADEMIC_CORRELATION_IMPLEMENTATION_PLAN.md'
      - 'docs/formulas/RAFAELIA_SYMBOL_TABLE.md'
      - 'docs/yml/PROOF_OBLIGATION_REGISTRY.yml'
      - 'docs/workflows/RLL_RESEARCH_FRAGMENT_ROUTE_V1.md'
      - 'results/relational_validation/RELATIONAL_VALIDATION_LEDGER.yml'
      - 'results/relational_validation/packages/ACADEMIC_CORR_001/**'
      - 'schemas/relational_validation_package.schema.json'
      - 'schemas/relation_graph.schema.json'
      - 'tools/validate_academic_correlation_package.py'
      - 'tools/ingest_arxiv_candidate.py'
      - 'tools/build_research_fragment_site_data.py'
      - 'data/research_fragments/academic_correlation_sources.yml'
      - 'pages/rll-research/**'
      - 'tests/test_academic_correlation_package_validator.py'
      - 'tests/test_numeric_representation_semantics.py'
      - 'tests/test_research_fragment_pipeline.py'
      - '.github/workflows/validate-academic-correlation-package.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/research/ACADEMIC_CORRELATION_CANDIDATE_MAP.md'
      - 'docs/codex/CODEX_ACADEMIC_CORRELATION_IMPLEMENTATION_PLAN.md'
      - 'docs/formulas/RAFAELIA_SYMBOL_TABLE.md'
      - 'docs/yml/PROOF_OBLIGATION_REGISTRY.yml'
      - 'docs/workflows/RLL_RESEARCH_FRAGMENT_ROUTE_V1.md'
      - 'results/relational_validation/RELATIONAL_VALIDATION_LEDGER.yml'
      - 'results/relational_validation/packages/ACADEMIC_CORR_001/**'
      - 'schemas/relational_validation_package.schema.json'
      - 'schemas/relation_graph.schema.json'
      - 'tools/validate_academic_correlation_package.py'
      - 'tools/ingest_arxiv_candidate.py'
      - 'tools/build_research_fragment_site_data.py'
      - 'data/research_fragments/academic_correlation_sources.yml'
      - 'pages/rll-research/**'
      - 'tests/test_academic_correlation_package_validator.py'
      - 'tests/test_numeric_representation_semantics.py'
      - 'tests/test_research_fragment_pipeline.py'
      - '.github/workflows/validate-academic-correlation-package.yml'
  workflow_dispatch:
    inputs:
      arxiv_id:
        description: "Optional arXiv ID or versioned abstract/PDF URL; fetches one public metadata record."
        required: false
        default: ""
        type: string
      related_node_ids:
        description: "Optional comma-separated existing graph node IDs for a human-declared candidate relation."
        required: false
        default: ""
        type: string
      relation_note:
        description: "Optional short reason for the candidate relation; required when targets are supplied."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: academic-research-preview-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight dependencies
        run: python -m pip install --upgrade pip PyYAML pytest

      - name: Validate academic correlation package
        run: python tools/validate_academic_correlation_package.py

      - name: Run focused tests
        run: >-
          python -m pytest -q
          tests/test_academic_correlation_package_validator.py
          tests/test_numeric_representation_semantics.py
          tests/test_research_fragment_pipeline.py

      - name: Fetch one arXiv metadata record and create a pending relation candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.arxiv_id != '' }}
        env:
          ARXIV_ID: ${{ inputs.arxiv_id }}
          RELATED_NODE_IDS: ${{ inputs.related_node_ids }}
          RELATION_NOTE: ${{ inputs.relation_note }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: >-
          python tools/ingest_arxiv_candidate.py
          --arxiv-id "$ARXIV_ID"
          --relation-targets "$RELATED_NODE_IDS"
          --relation-note "$RELATION_NOTE"
          --output-dir artifacts/research-fragments/intake

      - name: Build source-hashed relation graph data
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          candidate_args=()
          if [ -f artifacts/research-fragments/intake/candidate.json ]; then
            candidate_args+=(--candidate-intake artifacts/research-fragments/intake/candidate.json)
          fi
          python tools/build_research_fragment_site_data.py \
            --output pages/rll-research/_data/research_graph.json \
            "${candidate_args[@]}"

      - name: Build Jekyll research-fragment preview
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./pages/rll-research
          destination: ./_site/research-fragments

      - name: Upload relation intake receipt
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.arxiv_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rll-research-intake-${{ github.run_id }}
          path: artifacts/research-fragments/intake/
          retention-days: 90

      - name: Upload Jekyll preview artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rll-research-fragments-pages-preview-${{ github.run_id }}
          path: ./_site/research-fragments/
          retention-days: 90
