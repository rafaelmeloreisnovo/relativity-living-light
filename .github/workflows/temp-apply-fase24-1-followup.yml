name: "TEMP — aplicar gaps finais FASE 24.1"

on:
  push:
    branches:
      - fix/fase24-1-orchestrator-artifacts-20260731
    paths:
      - ".github/workflows/temp-apply-fase24-1-followup.yml"

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Aplicar correção e executar testes focais
        run: |
          set -euo pipefail
          python tools/temp_apply_fase24_1_followup.py
          python -m pip install PyYAML pytest
          python -m py_compile tools/rll_pipeline_fase24_1_runtime.py
          python -m pytest -q \
            tests/test_rll_pipeline_fase24_1_runtime.py \
            tests/test_validate_six_sigma_real_data_controls.py
      - name: Gravar correção e remover aplicador temporário
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/rll_pipeline_fase24_1_runtime.py tests/test_rll_pipeline_fase24_1_runtime.py
          git rm tools/temp_apply_fase24_1_followup.py .github/workflows/temp-apply-fase24-1-followup.yml
          git commit -m "fix(fase24.1): fechar Pantheon, Bayes vazio e F-COS-04"
          git push origin HEAD:${{ github.ref_name }}
