name: "RLL FASE 24.1 — Gate Determinístico"

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Escopo da execução"
        required: true
        type: choice
        options:
          - dry_run
          - apenas_dados
          - apenas_ciencia
          - apenas_governanca
          - completo
        default: dry_run
  workflow_call:
    inputs:
      modo:
        description: "Escopo da execução"
        required: false
        type: string
        default: dry_run
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rll-pipeline-linear-completo.yml"
      - ".github/workflows/RLL-CI.yml"
      - ".github/workflows/RLL_SCIENTIFIC.yml"
      - ".github/workflows/bayes_analysis.yml"
      - "tools/rll_pipeline_deterministic.py"
      - "tools/validate_schema_contracts.py"
      - "tools/audit_github_workflows.py"
      - "tools/validate_claim_allowed_gate.py"
      - "tools/validate_schemas_claim_boundary.py"
      - "tests/test_rll_pipeline_deterministic.py"
      - "tests/test_scientific_workflow_path_filters.py"
      - "src/**"
      - "data/**"
      - "validation/**"
      - "requirements*.txt"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: rll-fase24-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  CLAIM_ALLOWED: "false"
  CLAIM_BOUNDARY: "claim_allowed=false; nenhum resultado histórico substitui evidência do run atual"
  CANONICAL_REAL_DATA_WORKFLOW: .github/workflows/real-data-complete-execution.yml
  SYNTHETIC_BOUNDARY: "synthetic,mock,fixture,placeholder,demo"

jobs:
  deterministic-gate:
    name: "Pipeline lógico 01–44"
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: "01 · Checkout sem persistência de credencial"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: pip

      - name: "Bootstrap mínimo do gate"
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML jsonschema

      - name: "02–43 · Executar orquestrador determinístico"
        id: gate
        env:
          DISPATCH_MODE: "${{ inputs.modo }}"
          EVENT_NAME: "${{ github.event_name }}"
        run: |
          set -o pipefail
          MODE="$DISPATCH_MODE"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            MODE="dry_run"
          fi
          test -n "$MODE" || MODE="dry_run"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          python tools/rll_pipeline_deterministic.py --mode "$MODE" \
            2>&1 | tee rll-fase24-1-console.log

      - name: "43 · Recalcular cadeia final SHA-256"
        if: always()
        run: |
          mkdir -p results/linear
          find results/linear logs/linear artifacts/linear \
            -type f ! -name CHECKSUMS.sha256 -print0 2>/dev/null \
            | sort -z \
            | xargs -0 -r sha256sum \
            > results/linear/CHECKSUMS.sha256
          test -s results/linear/CHECKSUMS.sha256

      - name: "44 · Publicar evidências mesmo com gate bloqueado"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rll-fase24-1-${{ github.run_id }}-${{ steps.gate.outputs.mode || 'unknown' }}
          path: |
            results/linear/
            logs/linear/
            artifacts/linear/
            rll-fase24-1-console.log
          retention-days: 30
          if-no-files-found: error
