name: "RLL Pipeline Linear Completo — Sequência Unificada (44 Steps)"

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo: completo=todos; apenas_ciencia=FASES 2-3; apenas_governanca=FASE 6; apenas_dados=FASE 1; dry_run=só setup"
        type: choice
        options:
          - completo
          - apenas_ciencia
          - apenas_governanca
          - apenas_dados
          - dry_run
        default: completo
      commit_artefato:
        description: "Commitar artefato de log ao repositório"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rll-pipeline-linear-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  CANONICAL_REAL_DATA_WORKFLOW: .github/workflows/real-data-complete-execution.yml
  SYNTHETIC_BOUNDARY: "synthetic, mock, fixture, placeholder, demo — proibidos como dados observacionais reais"
  CLAIM_BOUNDARY: "claim_allowed=false por F-COS-03 FAIL [E] (z_t_BAO=0.30) e F-COS-04 FAIL [E] (ln B10=-6.190). Resultados empíricos, não lacunas."

# ═══════════════════════════════════════════════════════════════════════════════
# ÚNICO JOB: pipeline-linear
# Executa diretamente os scripts de cada yml de origem, em sequência linear.
# Cada step declara a referência do yml de origem para rastreabilidade.
# O log final (step 43) gera PIPELINE_LINEAR_LOG.md com tabela step→yml→script.
# ═══════════════════════════════════════════════════════════════════════════════
jobs:
  pipeline-linear:
    name: "Pipeline Linear — 44 Steps Sequenciais"
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # ───────────────────────────────────────────────────────────────────────
      # FASE 0 · INFRAESTRUTURA (steps 01–06)
      # ───────────────────────────────────────────────────────────────────────

      - name: "01 · setup_ambiente [rll-validacao-cientifica-completa.yml > setup_ambiente]"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "02 · instalar_dependencias [RLL_SCIENTIFIC.yml > rll-validation | bayes_analysis.yml > run]"
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "REFERÊNCIA: RLL_SCIENTIFIC.yml > Job: rll-validation"
          echo "SCRIPT: pip install -e .[dev]"
          echo "══════════════════════════════════════════════════════════════"
          mkdir -p results/linear logs
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" 2>&1 | tee logs/step02_deps.log || pip install pyyaml jsonschema numpy scipy emcee dynesty matplotlib 2>&1 | tee -a logs/step02_deps.log
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt 2>&1 | tee logs/step02_deps.log
          fi
          STEP_STATUS=$?
          printf "02\tinstalar_dependencias\tRLL_SCIENTIFIC.yml\trll-validation\tpip install -e .[dev]\t$([ $STEP_STATUS -eq 0 ] && echo OK || echo FAIL)\n" >> results/linear/step_status.tsv
          echo "✅ 02 setup concluído"

      - name: "03 · validar_yaml_syntax [yml-syntax-validation.yml > validate-yaml]"
        if: ${{ inputs.modo != 'dry_run' }}
        continue-on-error: true
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "REFERÊNCIA: yml-syntax-validation.yml > Job: validate-yaml"
          echo "SCRIPT: python inline — yaml.safe_load_all sobre todos os *.yml"
          echo "══════════════════════════════════════════════════════════════"
          set +e
          python3 - <<'PY' 2>&1 | tee logs/step03_yaml_syntax.log
          from pathlib import Path
          import yaml, sys
          files = sorted(p for p in [*Path('.').rglob('*.yml'), *Path('.').rglob('*.yaml')] if '.git/' not in str(p))
          failed = 0
          for p in files:
              try:
                  list(yaml.safe_load_all(p.read_text(encoding='utf-8')))
                  print(f'OK   {p}')
              except Exception as exc:
                  failed += 1
                  print(f'FAIL {p}  {exc}')
          print(f'\nTOTAL={len(files)} FAILED={failed}')
          sys.exit(1 if failed else 0)
          PY
          STEP_STATUS=$?
          set -e
          printf "03\tvalidar_yaml_syntax\tyml-syntax-validation.yml\tvalidate-yaml\tpython inline yaml.safe_load_all\t$([ $STEP_STATUS -eq 0 ] && echo OK || echo FAIL)\n" >> results/linear/step_status.tsv
          echo "STATUS_03=$STEP_STATUS" >> "$GITHUB_ENV"

      - name: "04 · audit_workflows [yml-syntax-validation.yml > validate-yaml (audit step)]"
        if: ${{ inputs.modo != 'dry_run' }}
        continue-on-error: true
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "REFERÊNCIA: yml-syntax-validation.yml > Step: Validate workflow isolation"
          echo "SCRIPT: tools/audit_github_workflows.py --strict"
          echo "══════════════════════════════════════════════════════════════"
          set +e
          python3 tools/audit_github_workflows.py --strict 2>&1 | tee logs/step04_audit_workflows.log
          STEP_STATUS=$?
          set -e
          printf "04\taudit_workflows\tyml-syntax-validation.yml\tvalidate-yaml\ttools/audit_github_workflows.py --strict\t$([ $STEP_STATUS -eq 0 ] && echo OK || echo FAIL)\n" >> results/linear/step_status.tsv
          echo "STATUS_04=$STEP_STATUS" >> "$GITHUB_ENV"

      - name: "05 · validar_schema_contracts [validate-schema-contracts.yml > validate-schema-contracts]"
        if: ${{ inputs.modo != 'dry_run' }}
        continue-on-error: true
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "REFERÊNCIA: validate-schema-contracts.yml > Job: validate-schema-contracts"
          echo "SCRIPT: tools/validate_schema_contracts.py (ou equivalente)"
          echo "══════════════════════════════════════════════════════════════"
          set +e
          if [ -f tools/validate_schema_contracts.py ]; then
            python3 tools/validate_schema_contracts.py 2>&1 | tee logs/step05_schema.log
          elif [ -f scripts/validate_schema_contracts.py ]; then
            python3 scripts/validate_schema_contracts.py 2>&1 | tee logs/step05_schema.log
          else
            echo "Ferramenta validate_schema_contracts não encontrada — TOKEN_VAZIO" | tee logs/step05_schema.log
          fi
          STEP_STATUS=$?
          set -e
          printf "05\tvalidar_schema_contracts\tvalidate-schema-contracts.yml\tvalidate-schema-contracts\ttools/validate_schema_contracts.py\t$([ $STEP_STATUS -eq 0 ] && echo OK || echo FAIL)\n" >> results/linear/step_status.tsv
          echo "STATUS_05=$STEP_STATUS" >> "$GITHUB_ENV"

      - name: "06 · claim_boundary_gate [claim-boundary-quality-gates.yml > claim-boundary-gate]"
        if: ${{ inputs.modo != 'dry_run' }}
        continue-on-error: true
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "REFERÊNCIA: claim-boundary-quality-gates.yml > Job: claim-boundary-gate"
          echo "SCRIPT: tools/validate_claim_allowed_gate.py"
          echo "CLAIM_BOUNDARY: $CLAIM_BOUNDARY"
          echo "══════════════════════════════════════════════════════════════"
          set +e
          if [ -f tools/validate_claim_allowed_gate.py ]; then
            python3 tools/validate_claim_allowed_gate.py 2>&1 | tee logs/step06_claim_gate.log
          else
            echo "Validador de claim boundary não encontrado — verifique tools/validate_claim_allowed_gate.py" | tee logs/step06_claim_gate.log
          fi
          STEP_STATUS=$?
          set -e
          printf "06\tclaim_boundary_gate\tclaim-boundary-quality-gates.yml\tclaim-boundary-gate\ttools/validate_claim_allowed_gate.py\t$([ $STEP_STATUS -eq 0 ] && echo OK || echo FAIL)\n" >> results/linear/step_status.tsv
          echo "STATUS_06=$STEP_STATUS" >> "$GITHUB_ENV"

      # ───────────────────────────────────────────────────────────────────────
      # FASE 1 · DADOS E CONTRATOS (steps 07–12)
      # ───────────────────────────────────────────────────────────────────────

      - name: "07 · docs_inventory [repo-real-inventory.yml > build-real-inventory | rll-data-pipeline.yml]"
        if: ${{ inputs.modo == 'completo' || inputs.modo == 'apenas_dados' }}
        continue-on-error: true
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "REFERÊNCIA: repo-real-inventory.yml > Job: build-real-inventory"
          echo "SCRIPT: scripts/build_repo_real_inventory.py (ou find + wc)"
          echo "══════════════════════════════════════════════════════════════"
          set +e
          if [ -f scripts/build_repo_real_inventory.py ]; then
            python3 scripts/build_repo_real_inventory.py 2>&1 | tee logs/step07_inventory.log
          else
            find data/ docs/ scripts/ -type f | wc -l | tee logs/step07_inventory.log
            echo "Inventário via find — script completo não disponível" >> logs/step07_inventory.log
          fi
          STEP_STATUS=$?
          set -e
          printf "07\tdocs_inventory\trepo-real-inventory.yml\tbuild-real-inventory\tscripts/build_repo_real_inventory.py\t$([ $STEP_STATUS -eq 0 ] && echo OK || echo FAIL)\n" >> results/linear/step_status.tsv
          echo "STATUS_07=$STEP_STATUS" >> "$GITHUB_ENV"

      - name: "08 · validate_data_contract [real-data-contract-ci.yml > real-data-contract]"
        if: ${{ inputs.modo == 'completo' || inputs.modo == 'apenas_dados' }}
        continue-on-error: true
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "REFERÊNCIA: real-data-contract-ci.yml > Job: real-data-contract"
          echo "SCRIPT: pytest tests/test_real_data_contract*.py (ou equivalente)"
          echo "══════════════════════════════════════════════════════════════"
          set +e
          if [ -f tools/validate_real_data_contract.py ]; then
            python3 tools/validate_real_data_contract.py 2>&1 | tee logs/step08_data_contract.log
          else
            python3 -m pytest -q tests/ -k "real_data_contract" 2>&1 | tee logs/step08_data_contract.log || \
            echo "Testes de contrato não encontrados — TOKEN_VAZIO" >> logs/step08_data_contract.log
          fi
          STEP_STATUS=$?
          set -e
          printf "08\tvalidate_data_contract\treal-data-contract-ci.yml\treal-data-contract\tpytest -k real_data_contract\t$([ $STEP_STATUS -eq 0 ] && echo OK || echo FAIL)\n" >> results/linear/step_status.tsv
          echo "STATUS_08=$STEP_STATUS" >> "$GITHUB_ENV"

      - name: "09 · verify_real_sources [real-data-complete-execution.yml > verify_real_source_signatures]"
        if: ${{ inputs.modo == 'completo' || inputs.modo == 'apenas_dados' }}
        continue-on-error: true
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "REFERÊNCIA: real-data-complete-execution.yml > Job: verify_real_source_signatures"
          echo "SCRIPT: scripts/verify_real_source_signatures.py"
          echo "══════════════════════════════════════════════════════════════"
          set +e
          if [ -f scripts/verify_real_source_signatures.py ]; then
            python3 scripts/verify_real_source_signatures.py 2>&1 | tee logs/step09_sources.log
          else
            echo "Verificando assinaturas via sha256sum..." | tee logs/step09_sources.log
            find data/real/ -type f -exec sha256sum {} \; 2>&1 | tee -a logs/step09_sources.log || \
            echo "Diretório data/real/ não encontrado — TOKEN_VAZIO" >> logs/step09_sources.log
          fi
          STEP_STATUS=$?
          set -e
          printf "09\tverify_real_sources\treal-data-complete-execution.yml\tverify_real_source_signatures\tscripts/verify_real_source_signatures.py\t$([ $STEP_STATUS -eq 0 ] && echo OK || echo FAIL)\n" >> results/linear/step_status.tsv
          echo "STATUS_09=$STEP_STATUS" >> "$GITHUB_ENV"

      - name: "10 · data_audit [real-data-complete-execution.yml > real_data_materialization_audit]"
        if: ${{ inputs.modo == 'completo' || inputs.modo == 'apenas_dados' }}
        continue-on-error: true
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "REFERÊNCIA: real-data-complete-execution.yml > Job: real_data_materialization_audit"
          echo "SCRIPT: tools/ci/real_data_workflow_policy.sh"
          echo "══════════════════════════════════════════════════════════════"
          set +e
          if [ -f tools/ci/real_data_workflow_policy.sh ]; then
            bash tools/ci/real_data_workflow_policy.sh 2>&1 | tee logs/step10_data_audit.log
          else
            echo "Política de dados reais não encontrada em tools/ci/real_data_workflow_policy.sh" | tee logs/step10_data_audit.log
          fi
          STEP_STATUS=$?
          set -e
          printf "10\tdata_audit\treal-data-complete-execution.yml\treal_data_materialization_audit\ttools/ci/real_data_workflow_policy.sh\t$([ $STEP_STATUS -eq 0 ] && echo OK || echo FAIL)\n" >> results/linear/step_status.tsv
          echo "STATUS_10=$STEP_STATUS" >> "$GITHUB_ENV"

      - name: "11 · raw_manifest_status [raw-data-manifest-status.yml > build-raw-data-manifest-status]"
        if: ${{ inputs.modo == 'completo' || inputs.modo == 'apenas_dados' }}
        continue-on-error: true
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "REFERÊNCIA: raw-data-manifest-status.yml > Job: build-raw-data-manifest-status"
          echo "SCRIPT: scripts/build_raw_data_manifest_status.py"
          echo "══════════════════════════════════════════════════════════════"
          set +e
          if [ -f scripts/build_raw_data_manifest_status.py ]; then
            python3 scripts/build_raw_data_manifest_status.py 2>&1 | tee logs/step11_manifest.log
          else
            echo "Script não encontrado — TOKEN_VAZIO" | tee logs/step11_manifest.log
          fi
          STEP_STATUS=$?
          set -e
          printf "11\traw_manifest_status\traw-data-manifest-status.yml\tbuild-raw-data-manifest-status\tscripts/build_raw_data_manifest_status.py\t$([ $STEP_STATUS -eq 0 ] && echo OK || echo FAIL)\n" >> results/linear/step_status.tsv
          echo "STATUS_11=$STEP_STATUS" >> "$GITHUB_ENV"

      - name: "12 · real_seed_ingestion [real-seed-ingestion-plan.yml > build-real-seed-ingestion-plan]"
        if: ${{ inputs.modo == 'completo' || inputs.modo == 'apenas_dados' }}
        continue-on-error: true
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "REFERÊNCIA: real-seed-ingestion-plan.yml > Job: build-real-seed-ingestion-plan"
          echo "SCRIPT: scripts/build_real_seed_ingestion_plan.py"
          echo "══════════════════════════════════════════════════════════════"
          set +e
          if [ -f scripts/build_real_seed_ingestion_plan.py ]; then
            python3 scripts/build_real_seed_ingestion_plan.py 2>&1 | tee logs/step12_seed.log
          else
            echo "Script não encontrado — TOKEN_VAZIO" | tee logs/step12_seed.log
          fi
          STEP_STATUS=$?
          set -e
          printf "12\treal_seed_ingestion\treal-seed-ingestion-plan.yml\tbuild-real-seed-ingestion-plan\tscripts/build_real_seed_ingestion_plan.py\t$([ $STEP_STATUS -eq 0 ] && echo OK || echo FAIL)\n" >> results/linear/step_status.tsv
          echo "STATUS_12=$STEP_STATUS" >> "$GITHUB_ENV"

      # ───────────────────────────────────────────────────────────────────────
      # FASE 2 · VALIDAÇÃO CIENTÍFICA CORE (steps 13–18)
      # ───────────────────────────────────────────────────────────────────────

      - name: "13 · pantheon_fit [rll-validacao-cientifica-completa.yml > fit_pantheon_rll]"
        if: ${{ inputs.modo == 'completo' || inputs.modo == 'apenas_ciencia' }}
        continue-on-error: true
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "REFERÊNCIA: rll-validacao-cientifica-completa.yml > Job: fit_pantheon_rll"
          echo "SCRIPT: scripts/pantheon/run_rll_vs_pantheon.py"
          echo "RESULTADO ESPERADO: chi2_RLL~710.6, chi2_LCDM~710.8, DAIC~+3.8 [E]"
          echo "══════════════════════════════════════════════════════════════"
          mkdir -p results/linear
          set +e
          python3 scripts/pantheon/run_rll_vs_pantheon.py 2>&1 | tee logs/step13_pantheon.log
          STEP_STATUS=$?
          set -e
          printf "13\tpantheon_fit\trll-validacao-cientifica-completa.yml\tfit_pantheon_rll\tscripts/pantheon/run_rll_vs_pantheon.py\t$([ $STEP_STATUS -eq 0 ] && echo OK || echo FAIL)\n" >> results/linear/step_status.tsv
          echo "STATUS_13=$STEP_STATUS" >> "$GITHUB_ENV"

      - name: "14 · desi_bao_covariance [desi-dr2-bao-validation.yml > desi-dr2-bao]"
        if: ${{ inputs.modo == 'completo' || inputs.modo == 'apenas_ciencia' }}
        continue-on-error: true
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "REFERÊNCIA: desi-dr2-bao-validation.yml > Job: desi-dr2-bao"
          echo "SCRIPT: scripts/check_desi_dr2_bao_covariance.py"
          echo "══════════════════════════════════════════════════════════════"
          set +e
          if [ -f scripts/check_desi_dr2_bao_covariance.py ]; then
            python3 scripts/check_desi_dr2_bao_covariance.py 2>&1 | tee logs/step14_desi_cov.log
          else
            echo "Script não encontrado — TOKEN_VAZIO" | tee logs/step14_desi_cov.log
          fi
          STEP_STATUS=$?
          set -e
          printf "14\tdesi_bao_covariance\tdesi-dr2-bao-validation.yml\tdesi-dr2-bao\tscripts/check_desi_dr2_bao_covariance.py\t$([ $STEP_STATUS -eq 0 ] && echo OK || echo FAIL)\n" >> results/linear/step_status.tsv
          echo "STATUS_14=$STEP_STATUS" >> "$GITHUB_ENV"

      - name: "15 · desi_bao_nominal [rll-validacao-cientifica-completa.yml > fit_desi_bao]"
        if: ${{ inputs.modo == 'completo' || inputs.modo == 'apenas_ciencia' }}
        continue-on-error: true
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "REFERÊNCIA: rll-validacao-cientifica-completa.yml > Job: fit_desi_bao"
          echo "SCRIPT: scripts/compute_rll_real_pipeline.py --desi-only"
          echo "RESULTADO ESPERADO: chi2_DESI_nominal=93.81 (params Planck) [E]"
          echo "══════════════════════════════════════════════════════════════"
          set +e
          if [ -f scripts/compute_rll_real_pipeline.py ]; then
            python3 scripts/compute_rll_real_pipeline.py --desi-only 2>&1 | tee logs/step15_desi_nominal.log
          else
            echo "Script não encontrado — TOKEN_VAZIO" | tee logs/step15_desi_nominal.log
          fi
          STEP_STATUS=$?
          set -e
          printf "15\tdesi_bao_nominal\trll-validacao-cientifica-completa.yml\tfit_desi_bao\tscripts/compute_rll_real_pipeline.py --desi-only\t$([ $STEP_STATUS -eq 0 ] && echo OK || echo FAIL)\n" >> results/linear/step_status.tsv
          echo "STATUS_15=$STEP_STATUS" >> "$GITHUB_ENV"

      - name: "16 · weff_cpl_mapping [rll-validacao-cientifica-completa.yml > weff_cpl_mapping]"
        if: ${{ inputs.modo == 'completo' || inputs.modo == 'apenas_ciencia' }}
        continue-on-error: true
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "REFERÊNCIA: rll-validacao-cientifica-completa.yml > Job: weff_cpl_mapping"
          echo "SCRIPT: scripts/compute_weff_cpl_mapping.py --w0 -0.838 --wa -0.62"
          echo "══════════════════════════════════════════════════════════════"
          set +e
          if [ -f scripts/compute_weff_cpl_mapping.py ]; then
            python3 scripts/compute_weff_cpl_mapping.py --w0 -0.838 --wa -0.62 2>&1 | tee logs/step16_weff.log
          else
            echo "Script não encontrado — TOKEN_VAZIO" | tee logs/step16_weff.log
          fi
          STEP_STATUS=$?
          set -e
          printf "16\tweff_cpl_mapping\trll-validacao-cientifica-completa.yml\tweff_cpl_mapping\tscripts/compute_weff_cpl_mapping.py\t$([ $STEP_STATUS -eq 0 ] && echo OK || echo FAIL)\n" >> results/linear/step_status.tsv
          echo "STATUS_16=$STEP_STATUS" >> "$GITHUB_ENV"

      - name: "17 · zt_falsification [rll-validacao-cientifica-completa.yml > zt_falsification]"
        if: ${{ inputs.modo == 'completo' || inputs.modo == 'apenas_ciencia' }}
        continue-on-error: true
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "REFERÊNCIA: rll-validacao-cientifica-completa.yml > Job: zt_falsification"
          echo "SCRIPT: scripts/slingshot_zt_falsification.py"
          echo "RESULTADO ESPERADO: F-COS-03 FAIL [E] — z_t_BAO=0.30 fora de [0.5,1.5]"
          echo "══════════════════════════════════════════════════════════════"
          set +e
          if [ -f scripts/slingshot_zt_falsification.py ]; then
            python3 scripts/slingshot_zt_falsification.py 2>&1 | tee logs/step17_zt.log
          else
            echo "Script não encontrado — TOKEN_VAZIO" | tee logs/step17_zt.log
          fi
          STEP_STATUS=$?
          set -e
          printf "17\tzt_falsification\trll-validacao-cientifica-completa.yml\tzt_falsification\tscripts/slingshot_zt_falsification.py\t$([ $STEP_STATUS -eq 0 ] && echo OK || echo FAIL)\n" >> results/linear/step_status.tsv
          echo "STATUS_17=$STEP_STATUS" >> "$GITHUB_ENV"

      - name: "18 · h0_grid_scan [rll-validacao-cientifica-completa.yml > h0_grid_scan]"
        if: ${{ inputs.modo == 'completo' || inputs.modo == 'apenas_ciencia' }}
        continue-on-error: true
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "REFERÊNCIA: rll-validacao-cientifica-completa.yml > Job: h0_grid_scan"
          echo "SCRIPT: scripts/run_h0_grid_expansion.py"
          echo "══════════════════════════════════════════════════════════════"
          set +e
          if [ -f scripts/run_h0_grid_expansion.py ]; then
            python3 scripts/run_h0_grid_expansion.py 2>&1 | tee logs/step18_h0_grid.log
          else
            echo "Script não encontrado — TOKEN_VAZIO" | tee logs/step18_h0_grid.log
          fi
          STEP_STATUS=$?
          set -e
          printf "18\th0_grid_scan\trll-validacao-cientifica-completa.yml\th0_grid_scan\tscripts/run_h0_grid_expansion.py\t$([ $STEP_STATUS -eq 0 ] && echo OK || echo FAIL)\n" >> results/linear/step_status.tsv
          echo "STATUS_18=$STEP_STATUS" >> "$GITHUB_ENV"

      # ───────────────────────────────────────────────────────────────────────
      # FASE 3 · MCMC + BAYES P0 (steps 19–23)
      # ───────────────────────────────────────────────────────────────────────

      - name: "19 · rll_ci_validation [RLL-CI.yml > rll]"
        if: ${{ inputs.modo == 'completo' || inputs.modo == 'apenas_ciencia' }}
        continue-on-error: true
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "REFERÊNCIA: RLL-CI.yml > Job: rll"
          echo "SCRIPT: python -m validation.run_lcdm; python -m validation.run_rll; compare_models; check_falsification"
          echo "══════════════════════════════════════════════════════════════"
          set +e
