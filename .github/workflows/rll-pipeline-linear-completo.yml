          contrato = f"""# CONTRATO DE FALSIFICADORES — RLL Linear Pipeline
          Data: {today} | Pipeline: rll-pipeline-linear-completo.yml

          ## Claim Boundary
          `claim_allowed = false` por F-COS-03 FAIL [E] e F-COS-04 FAIL [E].
          Resultados empíricos — não TOKEN_VAZIO estrutural (zero).

          ## Tabela de Falsificadores

          | ID | Falsificador | Threshold | Resultado [E] | Status |
          |----|-------------|-----------|--------------|--------|
          | F-COS-01 | ΔAIC(RLL−ΛCDM) < +10 | ΔAIC < 10 | {f_cos_01_aic:.3f} | ✅ PASS |
          | F-COS-02 | χ²_Pantheon/dof < 1.05 | χ²_red < 1.05 | {f_cos_02_chi2:.4f} | ✅ PASS |
          | F-COS-03 | z_t ∈ [0.5, 1.5] | 0.5 ≤ z_t ≤ 1.5 | z_t_BAO={f_cos_03_zt} | ✗ FAIL |
          | F-COS-04 | ln(B₁₀) > −5 (Jeffreys) | ln(B₁₀) > −5 | {f_cos_04_lnb10:.3f}±0.691 | ✗ FAIL |
          | F-COS-05 | χ²_DESI nominal < 150 | χ²_nominal < 150 | {f_cos_05_chi2} | ✅ PASS |

          **Resumo**: 3/5 PASS · 2/5 FAIL · 0/5 TOKEN_VAZIO

          *Gerado automaticamente pelo step 41 do rll-pipeline-linear-completo.yml*
          """

          out = Path('results/linear/CONTRATO_FALSIFICADORES_LINEAR.md')
