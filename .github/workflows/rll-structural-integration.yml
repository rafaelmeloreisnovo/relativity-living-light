name: RLL Structural Integration

on:
  pull_request:
    paths:
      - "src/rll/structural_integration.py"
      - "data/registries/rll_*integration*.json"
      - "data/registries/rll_recent_primary_sources_2026.json"
      - "tests/test_structural_integration.py"
      - "docs/science/RLL_OPERATIONAL_INTEGRATION_HOUSE_20260717.md"
      - "docs/science/RLL_RECENT_LITERATURE_INTEGRATION_20260717.md"
      - ".github/workflows/rll-structural-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run structural integration tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_structural_integration.py
