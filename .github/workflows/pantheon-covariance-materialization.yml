name: Pantheon Covariance Materialization

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/fetch_pantheon_covariance.py"
      - "tests/test_fetch_pantheon_covariance.py"
      - ".github/workflows/pantheon-covariance-materialization.yml"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: pantheon-covariance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned RLL revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run focal policy tests
        run: python -m pytest -q tests/test_fetch_pantheon_covariance.py

      - name: Materialize pinned official STAT+SYS covariance
        env:
          OUTPUT_DIR: ${{ runner.temp }}/pantheon-covariance
          RECEIPT: ${{ runner.temp }}/pantheon-covariance-receipt.json
        run: |
          set -euo pipefail
          python scripts/fetch_pantheon_covariance.py \
            --output-dir "$OUTPUT_DIR" \
            --receipt "$RECEIPT" \
            --allow-calibration
          cp "$OUTPUT_DIR/Pantheon+SH0ES_STAT+SYS.cov.sha256" \
             "${{ runner.temp }}/Pantheon+SH0ES_STAT+SYS.cov.sha256"
          test ! -e "data/real/cosmology/pantheon_plus/Pantheon+_Data/4_DISTANCES_AND_COVAR/Pantheon+SH0ES_STAT+SYS.cov"

      - name: Upload compact custody receipt only
        uses: actions/upload-artifact@v4
        with:
          name: pantheon-covariance-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pantheon-covariance-receipt.json
            ${{ runner.temp }}/Pantheon+SH0ES_STAT+SYS.cov.sha256
          if-no-files-found: error
          retention-days: 30
