schema: rll.workflow_orchestrator.catalog.v2
profiles:
  full_session:
    description: "Run the complete bounded catalog; the long frontier run is isolated."
    include_tags: [all]
  quick_session:
    description: "Run only the fast YAML syntax gate."
    include_tags: [quick]
  real_data_session:
    description: "Run the controlled real-data and metadata-only pipeline."
    include_tags: [real_data, real_data_preflight]
  science_session:
    description: "Run bounded science and research-fragment packaging."
    include_tags: [bounded_science]
  frontier_session:
    description: "Run the long frontier research workflow in isolation."
    include_tags: [frontier]
  literature_session:
    description: "Validate the academic relation package and build the Jekyll preview."
    include_tags: [bibliography]
  pages_preview_session:
    description: "Build the research-fragment Pages preview without deploying it."
    include_tags: [pages_preview]

# Explicit manifests define the workflows the session may dispatch.
# Root workflow discovery is intentionally disabled to prevent broad fan-out.
execution:
  mode: sequential
  stage_barrier: true
  max_in_flight: 1

workflow_catalog_dirs:
  - workflows/core
  - workflows/real_data
  - workflows/science
